# =============================================================================
# HLF Dynamic Deployment Configuration
# =============================================================================
# Run:   ./hlf-deploy.sh config.yaml
#        ./hlf-deploy.sh config.yaml --skip-confirm    (no confirmation prompts)
#        ./hlf-deploy.sh config.yaml --step=5           (skip to step 5)
# =============================================================================

# =============================================================================
# GLOBAL: Image versions, storage, and defaults
# =============================================================================
global:
  peer_image: hyperledger/fabric-peer
  peer_version: "3.1.3"
  orderer_image: hyperledger/fabric-orderer
  orderer_version: "3.1.3"
  ca_image: hyperledger/fabric-ca
  ca_version: "1.5.16"
  storage_class: sbs-15k-retain
  ca_capacity: 1Gi
  orderer_capacity: 2Gi
  peer_capacity: 5Gi
  peer_statedb: couchdb          # couchdb | leveldb
  enroll_id: enroll
  enroll_pw: enrollpw

# =============================================================================
# CA SIGNING: Certificate expiry settings for all CAs
# =============================================================================
# CA cert does NOT auto-renew. Set a long expiry (default: 10 years).
# Peer/orderer/identity certs auto-renew if enabled in the operator helm values.
#
# ca_expiry:  CA signing profile expiry (root cert validity)
# tls_expiry: TLS cert expiry issued by the CA
# default_expiry: Default expiry for other certs issued by the CA
# =============================================================================
ca_signing:
  ca_expiry: "87600h"            # 10 years (CA cert - no auto-renew)
  tls_expiry: "87600h"           # 10 years
  default_expiry: "87600h"       # 10 years

# =============================================================================
# ORDERER: Ordering service organization
# =============================================================================
# Orderers receive transactions, order them, and package into blocks.
# count: 3 creates orderer0, orderer1, orderer2 running Raft consensus.
# 3 nodes ensure fault-tolerance: 1 node can fail (2/3 quorum).
# =============================================================================
orderer:
  namespace: orderer
  mspid: ordererMSP
  ca_name: orderer-ca
  admin_user: ordadmin
  admin_pw: ordadminpw
  count: 3                       # orderer0, orderer1, orderer2

# =============================================================================
# ORGS: Peer organizations participating in the network
# =============================================================================
# Each org is an independent entity (e.g., a company or department).
# - ca_name:    Dedicated Certificate Authority for the org
# - peer_count: Number of peer nodes to deploy
#
# Peers store a copy of the ledger and execute chaincode (smart contracts).
# More peers = higher redundancy + more transaction throughput.
#
# peer_count: 0 means the org only has a CA (identity management),
# but cannot join channels or run chaincodes.
# =============================================================================
orgs:
  - name: nodea
    namespace: nodea
    mspid: nodeaMSP
    ca_name: nodea-ca
    admin_user: admin
    admin_pw: adminpw
    peer_count: 0                # CA only, no peers

  - name: nodeb
    namespace: nodeb
    mspid: nodebMSP
    ca_name: nodeb-ca
    admin_user: admin
    admin_pw: adminpw
    peer_count: 2                # peer0, peer1

  - name: nodec
    namespace: nodec
    mspid: nodecMSP
    ca_name: nodec-ca
    admin_user: admin
    admin_pw: adminpw
    peer_count: 2                # peer0, peer1

  - name: noded
    namespace: noded
    mspid: nodedMSP
    ca_name: noded-ca
    admin_user: admin
    admin_pw: adminpw
    peer_count: 2                # peer0, peer1

# =============================================================================
# CHANNEL CONFIG: Default settings applied to all channels
# =============================================================================
# batchTimeout: Max time orderer waits before cutting a block (lower = faster)
# batchSize.maxMessageCount: Max transactions per block
# =============================================================================
channel_config:
  batch_timeout: "0.5s"
  batch_size:
    max_message_count: 200
    absolute_max_bytes: 1048576   # 1 MB
    preferred_max_bytes: 524288   # 512 KB

# =============================================================================
# CHANNELS: Private communication channels between orgs
# =============================================================================
# A channel is a private ledger shared only by its member orgs.
# One org can participate in multiple channels.
# Data on different channels is completely isolated.
#
# peers: Specify exactly which peers join this channel.
#   e.g., aircraft-group: nodeb only needs peer0, not peer1.
# =============================================================================
channels:
  - name: oem-group
    orgs:
      - name: nodec
        peers: [peer0, peer1]

  - name: parts-group-01
    orgs:
      - name: nodeb
        peers: [peer0, peer1]
      - name: nodec
        peers: [peer0, peer1]
      - name: noded
        peers: [peer0, peer1]

  - name: asset-oem-group
    orgs:
      - name: nodec
        peers: [peer0, peer1]

  - name: assets-group-01
    orgs:
      - name: nodeb
        peers: [peer0, peer1]
      - name: nodec
        peers: [peer0, peer1]
      - name: noded
        peers: [peer0, peer1]

  - name: aircraft-group
    orgs:
      - name: nodeb
        peers: [peer0]           # only peer0, not peer1
      - name: nodec
        peers: [peer0, peer1]
      - name: noded
        peers: [peer0]           # only peer0

# =============================================================================
# CHAINCODES: Smart contracts deployed to channels
# =============================================================================
# Deployed as CCAAS (Chaincode-as-a-Service): runs as a separate container.
# One deployment per org serves all channels (shared service).
#
# Deploy lifecycle:
#   1. PACKAGE  - Build .tgz with connection info
#   2. INSTALL  - Install package on all peers of active orgs
#   3. APPROVE  - Each org approves the chaincode definition
#   4. COMMIT   - Finalize definition on the channel
#   5. SYNC     - Deploy CCAAS container (1 per org, shared across channels)
#   6. PING     - Verify chaincode is operational
#
# orgs: Which orgs install + approve (must be a subset of each channel's orgs).
#   Script automatically filters to only orgs present in each channel.
#   Endorsement policy auto-generated: OR('org1MSP.member','org2MSP.member',...)
# =============================================================================
chaincodes:
  - name: part-origence-chaincode
    version: "1.0"
    sequence: 1
    image: rg.fr-par.scw.cloud/origence-common-registry/origence-hlf-chaincode:latest
    replicas: 1
    channels: [oem-group, parts-group-01]
    orgs: [nodeb, nodec, noded]

  - name: access-origence-chaincode
    version: "1.0"
    sequence: 1
    image: rg.fr-par.scw.cloud/origence-common-registry/origence-hlf-access-chaincode:latest
    replicas: 1
    channels: [oem-group, parts-group-01, asset-oem-group, assets-group-01, aircraft-group]
    orgs: [nodeb, nodec, noded]

  - name: asset-origence-chaincode
    version: "1.0"
    sequence: 1
    image: rg.fr-par.scw.cloud/origence-common-registry/origence-hlf-asset-chaincode:latest
    replicas: 1
    channels: [asset-oem-group, assets-group-01]
    orgs: [nodeb, nodec, noded]

  - name: aircraft-origence-chaincode
    version: "1.0"
    sequence: 1
    image: rg.fr-par.scw.cloud/origence-common-registry/origence-hlf-aircraft-chaincode:latest
    replicas: 1
    channels: [aircraft-group]
    orgs: [nodeb, nodec, noded]
